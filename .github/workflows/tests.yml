name: PFIV Guard tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install system OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q -rs
      - name: Validate purpose and PFIV fixtures
        run: python purpose_pfiv_evaluation.py
